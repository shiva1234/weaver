# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build API (Maven)

on:
  push:
    branches: [ main ]
    paths:
      - 'weaver-api/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'weaver-api/**'

jobs:
  build-weaver-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weaver-api

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & test
        run: ./mvnw -B -ntp verify

      - name: Build & push Docker image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          ./mvnw -B -ntp spring-boot:build-image -Dspring-boot.build-image.imageName=${{ secrets.DOCKER_USERNAME }}/weaver-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/weaver-api:${{ github.sha }}
